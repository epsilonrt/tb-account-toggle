# Build, test and package on macOS (universal disk image).
# On a v* tag, the disk image is attached to the GitHub release.
name: Build macOS

# Runs on pull requests into dev and into main (the dev -> main pull request gets its
# own build, required by the main ruleset), and on v* tags (release packages). Merging
# into dev does not build again: the pull request already built the merged result.
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# A newer push to the same pull request supersedes the running build. Pull requests are
# grouped by number: a pull_request run that starts after the merge gets github.ref =
# the base branch, and would otherwise share its group with other pull requests.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          cache: true

      - name: Ninja
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      # Universal binary: Apple Silicon and Intel
      - name: Configure
        run: cmake -S . -B build -G Ninja "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cmake --build build --target installer

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/*.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.dmg
