# Build, test and package on Windows (Inno Setup installer).
# On a v* tag, the installer is attached to the GitHub release.
name: Build Windows

# Runs on pull requests into dev and into main (the dev -> main pull request gets its
# own build, required by the main ruleset), and on v* tags (release packages). Merging
# into dev does not build again: the pull request already built the merged result.
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# A newer push to the same pull request supersedes the running build. Pull requests are
# grouped by number: a pull_request run that starts after the merge gets github.ref =
# the base branch, and would otherwise share its group with other pull requests.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Qt MinGW kit with the MinGW and Ninja it ships with (layout of the Qt installer,
      # found by cmake/QtMinGWToolchain.cmake through the qtpaths on PATH)
      - uses: jurplel/install-qt-action@v4
        with:
          # Latest Qt that aqtinstall (3.3.0) can install on Windows: it cannot read the
          # Windows repository of Qt 6.11 yet
          version: '6.10.3'
          arch: win64_mingw
          tools: 'tools_mingw1310 tools_ninja'
          cache: true

      # Pinned version (the runner image may ship another one): CPack's INNOSETUP
      # generator targets Inno Setup 6
      - name: Inno Setup
        shell: pwsh
        env:
          INNOSETUP_VERSION: 6.7.1
        run: |
          function Get-InnoVersion {
            (Get-ItemProperty HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*, HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* -ErrorAction SilentlyContinue |
              Where-Object DisplayName -like 'Inno Setup*').DisplayVersion
          }
          if ((Get-InnoVersion) -ne $env:INNOSETUP_VERSION) {
            choco install innosetup --version=$env:INNOSETUP_VERSION --allow-downgrade --force -y --no-progress
          }
          $installed = Get-InnoVersion
          if ($installed -ne $env:INNOSETUP_VERSION) { throw "Inno Setup $installed installed, $env:INNOSETUP_VERSION expected" }
          "Inno Setup $installed"

      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cmake --build build --target installer

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/tb-account-toggle-setup-*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/tb-account-toggle-setup-*.exe
