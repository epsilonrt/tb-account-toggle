# Build, test and package on Windows (Inno Setup installer).
# On a v* tag, the installer is attached to the GitHub release.
name: Build Windows

# Runs on pull requests into dev, on pushes to dev (the merged result: its checks also
# satisfy the pull request dev -> main, which has the same head commit), and on v* tags
# (release packages). main only receives commits already tested on dev.
on:
  push:
    branches: [dev]
    tags: ['v*']
  pull_request:
    branches: [dev]
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the running build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Qt MinGW kit with the MinGW and Ninja it ships with (layout of the Qt installer,
      # found by cmake/QtMinGWToolchain.cmake through the qtpaths on PATH)
      - uses: jurplel/install-qt-action@v4
        with:
          # Latest Qt that aqtinstall (3.3.0) can install on Windows: it cannot read the
          # Windows repository of Qt 6.11 yet
          version: '6.10.3'
          arch: win64_mingw
          tools: 'tools_mingw1310 tools_ninja'
          cache: true

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cmake --build build --target installer

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/tb-account-toggle-setup-*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/tb-account-toggle-setup-*.exe
