# Build, test and package on Windows, Linux and macOS.
# On a v* tag, the packages are attached to a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: '6.8.3'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Qt MinGW kit with the MinGW and Ninja it ships with (layout of the Qt installer,
      # found by cmake/QtMinGWToolchain.cmake through the qtpaths on PATH)
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_mingw
          tools: 'tools_mingw1310 tools_ninja'
          cache: true

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cmake --build build --target installer

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/tb-account-toggle-setup-*.exe

  linux:
    runs-on: ubuntu-latest
    # Debian package built against the Qt of Debian 13 (trixie)
    container: debian:trixie
    steps:
      - name: Dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates git cmake ninja-build g++ dpkg-dev file \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools qt6-translations-l10n libgl-dev
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cmake --build build --target installer

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/*.deb

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Ninja
        run: brew list ninja >/dev/null 2>&1 || brew install ninja

      # Universal binary: Apple Silicon and Intel
      - name: Configure
        run: cmake -S . -B build -G Ninja "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cmake --build build --target installer

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
