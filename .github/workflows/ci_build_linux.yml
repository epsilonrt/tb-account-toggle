# Build, test and package on Debian 13 (trixie), against the distribution's Qt.
# On a v* tag, the Debian package is attached to the GitHub release.
name: Build Linux

# Runs on pull requests into dev and into main (the dev -> main pull request gets its
# own build, required by the main ruleset), and on v* tags (release packages). Merging
# into dev does not build again: the pull request already built the merged result.
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# A newer push to the same pull request supersedes the running build. Pull requests are
# grouped by number: a pull_request run that starts after the merge gets github.ref =
# the base branch, and would otherwise share its group with other pull requests.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates git cmake ninja-build g++ dpkg-dev file \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools qt6-translations-l10n libgl-dev
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cmake --build build --target installer

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/*.deb

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb
